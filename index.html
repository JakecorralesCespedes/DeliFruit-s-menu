<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeliFruit's — Menú</title>
  <meta name="description" content="Menú de DeliFruit's: heladería, batidos y milkshakes. Tocá un producto y armá tu pedido." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== NAV ===== -->
  <nav class="nav">
    <a class="nav__brand" href="#top">
      <span class="ring ring--mini" aria-hidden="true"></span>
      DeliFruit's
    </a>
    <div class="nav__links">
      <a href="#heladeria">Heladería</a>
      <a href="#batidos">Batidos</a>
      <a href="#milkshakes">MilkShakes</a>
    </div>
    <button class="nav__cart" id="cartBtn" aria-label="Ver pedido">
      🛒 <span class="nav__cart-count" id="cartCount">0</span>
    </button>
  </nav>

  <main id="top">

    <!-- ===== HELADERÍA ===== -->
    <section id="heladeria" class="page">
      <div class="page__content">
        <h2 class="page__title">Heladería</h2>
        <div class="items" id="items-heladeria"></div>
      </div>
      <div class="photo-rail" aria-label="Fotos de heladería">
        <figure class="photo" data-photo="ensaladas" style="--bg1:#ffd6e0; --bg2:#c9f2d0;">
          <img src="img/heladeria-ensalada.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🍉🥝</span>
          <figcaption>Ensalada de frutas</figcaption>
        </figure>
        <figure class="photo" data-photo="gelatina" style="--bg1:#ffe3ec; --bg2:#d4f8d4;">
          <img src="img/heladeria-gelatina.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🍨🍮</span>
          <figcaption>Gelatina con helado</figcaption>
        </figure>
        <figure class="photo" data-photo="crepas" style="--bg1:#ffd9f0; --bg2:#e8d5ff;">
          <img src="img/heladeria-crepa.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🥞🍓</span>
          <figcaption>Crepa especial</figcaption>
        </figure>
        <figure class="photo" data-photo="granizados" style="--bg1:#ffe0e0; --bg2:#fff3cf;">
          <img src="img/heladeria-granizado.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🍧🍓</span>
          <figcaption>Granizado con helado</figcaption>
        </figure>
        <figure class="photo" data-photo="helado-especial" style="--bg1:#fff0d9; --bg2:#ffd9e8;">
          <img src="img/heladeria-especial.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🧇🍨</span>
          <figcaption>Helado especial</figcaption>
        </figure>
      </div>
    </section>

    <!-- ===== BATIDOS ===== -->
    <section id="batidos" class="page page--alt">
      <div class="page__content">
        <h2 class="page__title">Batidos</h2>
        <div class="items items--dots" id="items-batidos"></div>
      </div>
      <div class="photo-rail" aria-label="Fotos de batidos">
        <figure class="photo" data-photo="batido-1" style="--bg1:#d2f4ef; --bg2:#fdf3d8;">
          <img src="img/batidos-1.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🥤🥤</span>
          <figcaption>Batidos con crema</figcaption>
        </figure>
        <figure class="photo" data-photo="batido-2" style="--bg1:#ffe8cf; --bg2:#fff7e0;">
          <img src="img/batidos-2.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🍹✨</span>
          <figcaption>Batido de maracuyá</figcaption>
        </figure>
        <figure class="photo" data-photo="batido-3" style="--bg1:#e8d9ff; --bg2:#ffd9ec;">
          <img src="img/batidos-3.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🍫🥤</span>
          <figcaption>Chocó maní</figcaption>
        </figure>
      </div>
    </section>

    <!-- ===== MILKSHAKES ===== -->
    <section id="milkshakes" class="page">
      <div class="page__content">
        <h2 class="page__title">MilkShakes</h2>
        <div class="items" id="items-milkshakes"></div>
      </div>
      <div class="photo-rail" aria-label="Fotos de milkshakes">
        <figure class="photo" data-photo="ms-helado" style="--bg1:#d2f4ef; --bg2:#fdf3d8;">
          <img src="img/milkshake-1.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🥛🍦</span>
          <figcaption>MilkShake de helado</figcaption>
        </figure>
        <figure class="photo" data-photo="ms-fruta" style="--bg1:#fff0d9; --bg2:#ffe0ef;">
          <img src="img/milkshake-2.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🍓🥛</span>
          <figcaption>MilkShake con fruta</figcaption>
        </figure>
        <figure class="photo" data-photo="ms-choco" style="--bg1:#ecd9ff; --bg2:#ffe9f4;">
          <img src="img/milkshake-3.jpg" alt="" onerror="this.remove()" />
          <span class="photo__emoji">🍫🎉</span>
          <figcaption>Chocolate con chispas</figcaption>
        </figure>
      </div>
    </section>

    <!-- ===== FOOTER / LOGO ===== -->
    <footer class="footer">
      <div class="ring ring--logo">
        <span class="ring__name">DeliFruit's</span>
        <span class="ring__icon" aria-hidden="true">🍒<br>🍧</span>
        <a class="ring__phone" href="https://wa.me/50661325941" target="_blank" rel="noopener">6132-5941</a>
      </div>
      <p class="footer__note">Tocá cualquier producto del menú para armar tu pedido 💜</p>
    </footer>

  </main>

  <!-- ===== MODAL DE PRODUCTO ===== -->
  <div class="modal" id="itemModal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" data-close aria-label="Cerrar">✕</button>
      <div class="modal__emoji" id="modalEmoji">🍦</div>
      <h3 class="modal__title" id="modalTitle"></h3>
      <p class="modal__hint" id="modalHint"></p>
      <div class="modal__options" id="modalOptions"></div>
      <div class="modal__flavors" id="modalFlavors"></div>
      <div class="modal__qty">
        <button id="qtyMinus" aria-label="Menos">−</button>
        <span id="qtyValue">1</span>
        <button id="qtyPlus" aria-label="Más">+</button>
      </div>
      <button class="modal__add" id="modalAdd">Agregar al pedido · <span id="modalPrice"></span></button>
    </div>
  </div>

  <!-- ===== LIGHTBOX DE FOTOS ===== -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="modal__backdrop" data-close></div>
    <figure class="lightbox__card">
      <button class="modal__close" data-close aria-label="Cerrar">✕</button>
      <div class="lightbox__media" id="lightboxMedia"></div>
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <!-- ===== CARRITO ===== -->
  <div class="cart" id="cart" hidden>
    <div class="modal__backdrop" data-close></div>
    <aside class="cart__panel" role="dialog" aria-modal="true" aria-label="Tu pedido">
      <button class="modal__close" data-close aria-label="Cerrar">✕</button>
      <h3 class="cart__title">Tu pedido</h3>
      <ul class="cart__list" id="cartList"></ul>
      <p class="cart__empty" id="cartEmpty">Aún no has agregado nada. Tocá un producto del menú 😋</p>
      <div class="cart__total" id="cartTotal"></div>
      <a class="cart__send" id="cartSend" href="#" target="_blank" rel="noopener">📱 Enviar pedido por WhatsApp</a>
    </aside>
  </div>

  <div class="toast" id="toast" hidden>✓ Agregado al pedido</div>

  <script src="script.js"></script>
</body>
</html>
